name: Integration Tests (Docker Compose)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Build and start services
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml up -d --build

      # Simple loop to wait until API is responding
      - name: Wait for API to be ready
        run: |
          echo "Waiting for API readiness..."
          for i in {1..30}; do
            if curl -k -sSf https://localhost/api > /dev/null; then
              echo "✅ API is up!"
              exit 0
            fi
            sleep 5
          done
          echo "❌ API did not start in time"
          exit 1

      - name: Shutdown containers
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml down -v