name: Backend CI (Build & Test)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup .NET
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # 3️⃣ Restore dependencies
      - name: Restore dependencies
        run: dotnet restore Nuggets.API/Nuggets.API.csproj

      # 4️⃣ Build project
      - name: Build
        run: dotnet build Nuggets.API/Nuggets.API.csproj --configuration Release --no-restore

      # 6️⃣ Build Docker image (for publish or GHCR)
      - name: Build Docker image
        run: |
          docker build -t ghcr.io/achlim/nuggets-api:latest -f Nuggets.API/Dockerfile .
