services:
  api:
    build:
      context: .
      dockerfile: Nuggets.API/Dockerfile
    container_name: nuggets_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=nuggets_erp;Username=postgres;Password=postgres
      - Jwt__SigningKey=nkg3*2kln3)!35G
      - Jwt__Issuer=nuggets
      - Jwt__Audience=nuggets_clients
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: nuggets_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nuggets_erp
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    container_name: nuggets_nginx
    depends_on:
      - api
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "443:443"
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:443/api"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
