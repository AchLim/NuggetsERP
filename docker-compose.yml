services:
  postgres:
    image: postgres:16
    container_name: nuggets_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nuggets_erp
    restart: unless-stopped
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  api:
    build:
      context: .
      dockerfile: Nuggets.API/Dockerfile
    platform: "linux/amd64"
    container_name: nuggets_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=nuggets_erp
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_KEY=nkg3*2kln3)!35GJl1pVnkg3*2kln3)!35GJl1pV
      - JWT_ISSUER=nuggets
      - JWT_AUDIENCE=nuggets_clients
#    env_file:
#      - Nuggets.API/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["/wait-for-postgres.sh", "postgres", "dotnet", "Nuggets.API.dll"]

  nginx:
    image: nginx:alpine
    container_name: nuggets_nginx
    depends_on:
      - api
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
